<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>No Access</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-2">No Bar Access</h4>
                    <p class="text-muted mb-4">
                        Your user is authenticated but not assigned to any bar/location.
                        Please contact your administrator.
                    </p>

                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary w-100" href="/logout">Logout</a>
                        <a class="btn btn-dark w-100" href="/login">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
